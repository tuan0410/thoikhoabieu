name: Mobile build checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', 'js/**', 'extension/**', 'index.html', 'style.css', 'scripts/build-mobile.cjs', 'scripts/build-vercel.cjs', 'scripts/ios-*.py', 'scripts/make_icons.py', '.github/workflows/mobile.yml']
permissions:
  contents: read
concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm install
        working-directory: mobile
      - run: npm run add:android
        working-directory: mobile
      - run: chmod +x android/gradlew && ./android/gradlew -p android assembleDebug
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: lichhoc-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
      - name: Publish direct Android preview download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/lichhoc-android.apk"
          printf 'Android preview build from commit %s.\n\nSchool login and synchronization still require testing on a real device.\n' "$GITHUB_SHA" > "$RUNNER_TEMP/android-preview-notes.md"
          if gh release view android-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit android-preview --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/android-preview-notes.md"
          else
            gh release create android-preview --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Lich Hoc Android Preview' --notes-file "$RUNNER_TEMP/android-preview-notes.md" --prerelease --latest=false
          fi
          gh release upload android-preview "$RUNNER_TEMP/lichhoc-android.apk" --repo "$GITHUB_REPOSITORY" --clobber
  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: npm install
        working-directory: mobile
      - run: npm run add:ios
        working-directory: mobile
      - name: Validate signing helpers and prepare iOS app icon
        run: |
          python3 -m unittest discover -s tests -p 'ios_profile_test.py'
          python3 scripts/ios-assets.py
          APPLE_TEAM_ID=TEST123456 LH_PROFILE_UUID=12345678-1234-1234-1234-1234567890ab node scripts/ios-project.cjs --check
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: lichhoc-ios-simulator
          path: mobile/build/Build/Products/Debug-iphonesimulator/App.app
