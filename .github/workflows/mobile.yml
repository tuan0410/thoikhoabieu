name: Mobile build checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', 'scripts/build-mobile.cjs', '.github/workflows/mobile.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - uses: android-actions/setup-android@v3
      - run: npm install
        working-directory: mobile
      - run: npm run add:android
        working-directory: mobile
      - run: chmod +x android/gradlew && ./android/gradlew -p android assembleDebug
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: lichhoc-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: npm install
        working-directory: mobile
      - run: npm run add:ios
        working-directory: mobile
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: lichhoc-ios-simulator
          path: mobile/build/Build/Products/Debug-iphonesimulator/App.app
